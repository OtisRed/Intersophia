<!doctype html>
<html lang="pl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}{% endblock %} · Intersophia</title>
<link rel="stylesheet" href="/assets/css/membership.css">
</head><body>
<header class="membership-header">
  <a class="membership-home" href="/" aria-label="Intersophia — wróć do strony głównej">
    <img src="/assets/logo.svg" alt="" width="280">
    <span class="membership-home-caption" aria-hidden="true">
      Wróć do strony głównej
      <svg viewBox="0 0 42 28" width="42" height="28" fill="none" stroke="currentColor"
           stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <path d="M2 24C16 28 34 26 36 16C38 6 20 1 5 5M11 1l-6 4 7 4"/>
      </svg>
    </span>
  </a>
  {% block header_actions %}{% endblock %}
</header>
{% block main %}<main class="membership-main"><section class="membership-card" aria-labelledby="title">
{% block content %}{% endblock %}
</section></main>{% endblock %}</body></html>

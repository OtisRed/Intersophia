<details class="member-access">
  <summary aria-label="Zarządzaj dostępem — {{ member.name or 'Członek SKN' }}">Zarządzaj dostępem</summary>
  <form method="post" action="{{ url_for('panel', widok='czlonkowie') }}">
    <input type="hidden" name="csrf" value="{{ csrf }}">
    <input type="hidden" name="user_id" value="{{ member.id }}">
    {% if member.role == "board" %}
    <button type="submit" name="action" value="remove-board">Odbierz rolę Zarządu</button>
    {% else %}
    <button type="submit" name="action" value="grant-board">Nadaj rolę Zarządu</button>
    {% endif %}
  </form>
  <details class="member-remove">
    <summary>Usuń członka</summary>
    <p>Ta osoba utraci dostęp do panelu, także w otwartej sesji.</p>
    <form method="post" action="{{ url_for('panel', widok='czlonkowie') }}">
      <input type="hidden" name="csrf" value="{{ csrf }}">
      <input type="hidden" name="user_id" value="{{ member.id }}">
      <button type="submit" name="action" value="revoke-access"
              aria-label="Potwierdź usunięcie członka {{ member.name or 'Członek SKN' }}">Potwierdź usunięcie</button>
    </form>
  </details>
</details>

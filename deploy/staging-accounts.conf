# Included only by the staging server block.
location ~ ^/(logowanie|panel|wyloguj|zaproszenie(?:/[^/]+)?|auth/(?:google(?:/callback)?|health))$ {
    client_max_body_size 11m;
    # Invitations and OAuth callbacks carry single-use tokens in the URL.
    access_log off;
    if ($http_x_forwarded_proto = http) {
        return 308 https://dev.intersophia.pl$request_uri;
    }
    proxy_set_header Host dev.intersophia.pl;
    proxy_set_header X-Forwarded-Proto https;
    proxy_pass http://127.0.0.1:8091;
}

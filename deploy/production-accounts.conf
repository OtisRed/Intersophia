# Include in the intersophia.pl server block only when enabling production accounts.
location ~ ^/(logowanie|panel|wyloguj|zaproszenie(?:/[^/]+)?|auth/(?:google(?:/callback)?|health))$ {
    # Invitations and OAuth callbacks carry single-use tokens in the URL.
    access_log off;
    if ($http_x_forwarded_proto = http) {
        return 308 https://intersophia.pl$request_uri;
    }
    proxy_set_header Host intersophia.pl;
    proxy_set_header X-Forwarded-Proto https;
    proxy_pass http://127.0.0.1:8092;
}

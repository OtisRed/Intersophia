<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Intersophia</title>
  <meta name="description" content="Prosty landing page FAQ w stylu OneNote, responsywny i gotowy na GitHub Pages." />

  <!-- styles + optional script -->
  <link rel="icon" href="assets/favicon.png" type="image/png">
  <link rel="stylesheet" href="assets/css/styles.css">
  <script src="assets/js/content.js" defer></script>
  <script src="assets/js/main.js" defer></script>
  <script type="module" src="assets/js/annotations.js"></script>
</head>
<body>
  <!-- ===== HEADER with full-width banner logo (SVG) ===== -->
  <header>
    <div class="bar">
      <div class="logo-banner" data-annotation-target="brand">
        <img src="assets/logo.svg" alt="Intersophia — logotyp" class="logo-img" loading="eager" decoding="async" />
      </div>
    </div>
  </header>

  <!-- ===== MAIN CONTENT ===== -->
  <main class="container">
    <!-- Desktop/tablet layout: content + left sidebar -->
    <div class="layout" id="desktopLayout" aria-label="Widok szeroki">
      <section class="main" id="content">
        <nav class="socials socials-desktop card-surface" aria-label="Szybkie linki" data-annotation-target="resources">
          <a class="icon-btn" data-annotation-target="page-facebook" href="https://www.facebook.com/intersophia" target="_blank" rel="noopener" aria-label="Facebook">
            <img src="assets/Facebook.svg" alt="" aria-hidden="true" loading="lazy">
          </a>
          <a class="icon-btn" data-annotation-target="page-messenger" href="https://m.me/ch/Abb04z6Dhz7iKNfP/" target="_blank" rel="noopener" aria-label="Messenger">
            <img src="assets/Messenger.svg" alt="" aria-hidden="true" loading="lazy">
          </a>
          <a class="icon-btn" data-annotation-target="page-instagram" href="https://www.instagram.com/skn.intersophia/" target="_blank" rel="noopener" aria-label="Instagram">
            <img src="assets/instagram.svg" alt="" aria-hidden="true" loading="lazy">
          </a>
          <a class="icon-btn" data-annotation-target="page-onenote" href="https://1drv.ms/o/c/6656db8f5421060d/EnO98xyOcmhJuqjap9eDRn0BdEY9alkwBZRFfdJh7QPxWw?e=xREEa6" target="_blank" rel="noopener" aria-label="OneNote">
            <img src="assets/OneNote.svg" alt="" aria-hidden="true" loading="lazy">
          </a>
          <a class="icon-btn" data-annotation-target="page-discord" href="https://discord.gg/ychQX2tNx" target="_blank" rel="noopener" aria-label="Discord">
            <img src="assets/Discord.svg" alt="" aria-hidden="true" loading="lazy">
          </a>
          <a class="icon-btn login-icon" data-annotation-target="page-login" href="/logowanie" aria-label="Zaloguj się" title="Zaloguj się">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"
                 stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M13 4h5a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-5M3 12h12m-4-4 4 4-4 4"/>
            </svg>
          </a>
        </nav>
        <div class="main-content">
          <div class="question-display" id="contentInner" role="region" aria-live="polite"></div>
        </div>
      </section>
  <aside class="sidebar card-surface" id="sidebar" aria-label="Nawigacja po pytaniach"></aside>
    </div>

    <!-- Mobile layout: accordion list -->
    <section class="mobile" aria-label="Widok mobilny">
      <nav class="socials socials-mobile card-surface" aria-label="Szybkie linki" data-annotation-target="resources">
        <a class="icon-btn" data-annotation-target="page-facebook" href="https://www.facebook.com/intersophia" target="_blank" rel="noopener" aria-label="Facebook">
          <img src="assets/Facebook.svg" alt="" aria-hidden="true" loading="lazy">
        </a>
        <a class="icon-btn" data-annotation-target="page-messenger" href="https://m.me/intersophia" target="_blank" rel="noopener" aria-label="Messenger">
          <img src="assets/Messenger.svg" alt="" aria-hidden="true" loading="lazy">
        </a>
        <a class="icon-btn" data-annotation-target="page-instagram" href="https://www.instagram.com/skn.intersophia/" target="_blank" rel="noopener" aria-label="Instagram">
          <img src="assets/instagram.svg" alt="" aria-hidden="true" loading="lazy">
        </a>
        <a class="icon-btn" data-annotation-target="page-onenote" href="https://1drv.ms/o/c/6656db8f5421060d/EnO98xyOcmhJuqjap9eDRn0BdEY9alkwBZRFfdJh7QPxWw?e=xREEa6" target="_blank" rel="noopener" aria-label="OneNote">
          <img src="assets/OneNote.svg" alt="" aria-hidden="true" loading="lazy">
        </a>
        <a class="icon-btn" data-annotation-target="page-discord" href="https://discord.gg/ychQX2tNx" target="_blank" rel="noopener" aria-label="Discord">
          <img src="assets/Discord.svg" alt="" aria-hidden="true" loading="lazy">
        </a>
        <a class="icon-btn login-icon" data-annotation-target="page-login" href="/logowanie" aria-label="Zaloguj się" title="Zaloguj się">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"
               stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M13 4h5a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-5M3 12h12m-4-4 4 4-4 4"/>
          </svg>
        </a>
      </nav>

      <div class="accordion" id="mobileAccordion"></div>
      <div class="mobile-footer card-surface">

      </div>
    </section>
  </main>
</body>
</html>
